global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'nexus-engine-backend'
    metrics_path: '/api/v1/analytics/metrics'
    static_configs:
      - targets: ['nexus-backend:8000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
